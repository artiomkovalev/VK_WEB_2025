<aside class="sidebar">
    <div class="sidebar-block">
        <h3>Popular Tags</h3>
        <div class="tag-list">
            {% for tag in popular_tags %}
            <a href="{% url 'tag' tag_name=tag.name %}" class="tag-badge" style="font-size: 14px;">{{ tag.name }}</a>
            {% empty %}
            <p>No tags</p>
            {% endfor %}
        </div>
    </div>
    <div class="sidebar-block">
        <h3>Best Members</h3>
        <ul class="sidebar-list">
            {% for member in best_members %}
            <li><a href="#">{{ member.username }}</a></li>
            {% empty %}
            <li>No active members</li>
            {% endfor %}
        </ul>
    </div>
</aside>
